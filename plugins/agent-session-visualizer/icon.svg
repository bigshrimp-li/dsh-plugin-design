<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- Branch lines -->
  <path d="M18 20 v20 a6 6 0 0 0 6 6 h12" fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M36 46 v-10 a6 6 0 0 1 6-6 h4" fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M18 20 h22" fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Branch pulse dot / return -->
  <path d="M46 30 l-4 -3 v6 z" fill="#38bdf8" />

  <!-- Nodes -->
  <circle cx="18" cy="20" r="5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="18" cy="20" r="2.5" fill="#ffffff" />

  <circle cx="40" cy="20" r="4" fill="#818cf8" />
  <circle cx="40" cy="20" r="2" fill="#ffffff" />

  <circle cx="36" cy="46" r="4.5" fill="#34d399" filter="url(#glow)" />
  <circle cx="36" cy="46" r="2" fill="#ffffff" />

  <circle cx="48" cy="30" r="3.5" fill="#f43f5e" />
</svg>
