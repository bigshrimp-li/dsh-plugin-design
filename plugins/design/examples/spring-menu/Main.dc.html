<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ember Coffee — Spring Menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Karla:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 880px; height: 560px; box-sizing: border-box; padding: 56px 64px; display: flex; gap: 48px; background: #FAF6F0; color: #2B2118; font-family: Karla, ui-sans-serif, system-ui, sans-serif">

<div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 12px">
<span style="display: block; width: 28px; height: 2px; background: {{accent}}"></span>
<p style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #6F6254">Spring 2026</p>
</div>

<h1 style="margin: 10px 0 0; font-family: Fraunces, Georgia, serif; font-size: 54px; line-height: 1.04; font-weight: 600; letter-spacing: -0.01em">Ember Coffee</h1>

<sc-if value="{{showNote}}" hint-placeholder-val="{{true}}">
<p style="margin: 14px 0 0; font-size: 15px; line-height: 23px; color: #6F6254; max-width: 36ch">Single-origin lots, roasted on Tuesdays and rested four days. Three on the bar this season.</p>
</sc-if>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 0">

<div style="display: flex; align-items: baseline; gap: 10px; padding: 12px 0; border-top: 1px solid #E4DBCF">
<div style="min-width: 0">
<p style="margin: 0; font-size: 16px; font-weight: 700">Ethiopia Guji</p>
<p style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: #6F6254">Washed · jasmine, apricot</p>
</div>
<span style="flex: 1 1 auto; border-bottom: 1px dotted #C9BCA9; transform: translateY(-4px)"></span>
<p style="margin: 0; font-size: 15px; font-weight: 700; color: {{accent}}; white-space: nowrap">[PRICE]</p>
</div>

<div style="display: flex; align-items: baseline; gap: 10px; padding: 12px 0; border-top: 1px solid #E4DBCF">
<div style="min-width: 0">
<p style="margin: 0; font-size: 16px; font-weight: 700">Colombia Huila</p>
<p style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: #6F6254">Natural · cocoa, red plum</p>
</div>
<span style="flex: 1 1 auto; border-bottom: 1px dotted #C9BCA9; transform: translateY(-4px)"></span>
<p style="margin: 0; font-size: 15px; font-weight: 700; color: {{accent}}; white-space: nowrap">[PRICE]</p>
</div>

<div style="display: flex; align-items: baseline; gap: 10px; padding: 12px 0; border-top: 1px solid #E4DBCF; border-bottom: 1px solid #E4DBCF">
<div style="min-width: 0">
<p style="margin: 0; font-size: 16px; font-weight: 700">House oat latte</p>
<p style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: #6F6254">Bar blend · 6 oz</p>
</div>
<span style="flex: 1 1 auto; border-bottom: 1px dotted #C9BCA9; transform: translateY(-4px)"></span>
<p style="margin: 0; font-size: 15px; font-weight: 700; color: {{accent}}; white-space: nowrap">[PRICE]</p>
</div>

</div>
</div>

<img src="/_blob/041f24dbde748efa4672edc83c017f0d" alt="" style="width: 304px; height: 448px; flex: 0 0 auto; object-fit: cover; border-radius: 8px">

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C2410C"},"showNote":{"editor":"boolean","default":true},"$preview":{"width":880,"height":560}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#C2410C', showNote: this.props.showNote ?? true };
}
}
</script>
</body>
</html>
