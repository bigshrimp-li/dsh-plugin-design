<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Profile card</title>
<script src="./support.js"></script>
</head><body><x-dc>
<helmet><style>body{margin:0}button,input{font:inherit}</style></helmet>
<div style="position: relative; width: 520px; height: 560px; box-sizing: border-box; padding: 36px; background: #ffffff; color: #16324f; font-family: sans-serif">
<h1 id="heading" style="margin: 0; font-size: 28px; color: #16324f">Profile card</h1>
<p id="subtitle" style="margin: 12px 0; font-size: 16px">A simple profile</p>
<button id="counter" type="button" onClick="{{increment}}" style="padding: 12px 24px; background: #16324f; color: white; border: 0; border-radius: 8px">{{count}}</button>
<p id="literal" style="margin: 24px 0">Edit this text</p>
<input id="name" placeholder="Your name" style="padding: 12px; border: 1px solid #ddd">
<a id="next" href="Layout.dc.html" style="display: block; margin-top: 20px">Next board</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":560}}'>
class Component extends DCLogic {
renderVals() {
return { count: (this.state && this.state.count) || 0,
increment: function () { this.setState({ count: ((this.state && this.state.count) || 0) + 1 }); }.bind(this),
items: [{name:'First item'}, {name:'Second item'}, {name:'Third item'}] };
}
}
</script></body></html>
