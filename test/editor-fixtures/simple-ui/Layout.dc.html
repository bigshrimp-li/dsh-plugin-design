<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Layout controls</title>
<script src="./support.js"></script>
</head><body><x-dc>
<helmet><style>body{margin:0}button,input{font:inherit}</style></helmet>
<div style="position: relative; width: 520px; height: 560px; box-sizing: border-box; padding: 36px; background: #ffffff; color: #16324f; font-family: sans-serif">
<h1 id="heading" style="margin: 0; font-size: 28px; color: #16324f">Layout controls</h1>
<p id="subtitle" style="margin: 12px 0; font-size: 16px">Move and resize</p>
<div id="moving" style="width: 140px; height: 65px; margin: 35px 0; background: #e4ad52; transform: translate(15px, 5px)">Move me</div>
<div id="absolute" style="position: absolute; left: 220px; top: 250px; width: 120px; height: 60px; box-sizing: content-box; padding: 10px; border: 3px solid #16324f; background: #d8e8f6">Resize me</div>
<div id="anchored" style="position: absolute; right: 40px; top: 75%; width: 130px; height: 45px; background: #e4ad52">Right anchored</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":560}}'>
class Component extends DCLogic {
renderVals() {
return { count: (this.state && this.state.count) || 0,
increment: function () { this.setState({ count: ((this.state && this.state.count) || 0) + 1 }); }.bind(this),
items: [{name:'First item'}, {name:'Second item'}, {name:'Third item'}] };
}
}
</script></body></html>
